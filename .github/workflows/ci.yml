name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    uses: PlataformaIntegradaInvestigadores/.github/.github/workflows/branch-name.yml@main

  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas de lint
        run: python -m pip install ruff==0.16.10 black==26.10.0
      - name: ruff check
        run: python -m ruff check .
      - name: black --check
        run: python -m black --check .

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Ejecutar tests unitarios
        env:
          COVERAGE_FILE: coverage-unitarios.dat
        run: |
          python -m pytest -v --tb=short -m "not integration" \
            --junitxml=report-unitarios.xml \
            --cov=app --cov-report=term --cov-fail-under=0
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-unitarios
          if-no-files-found: ignore
          path: |
            report-unitarios.xml
            coverage-unitarios.dat

  integration-tests:
    name: Tests de integración
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: governance_ci
          POSTGRES_PASSWORD: governance_ci
          POSTGRES_DB: governance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U governance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install -r requirements-dev.txt
      - name: Ejecutar tests de integración
        env:
          COVERAGE_FILE: coverage-integracion.dat
          # Throwaway CI service; the password only exists inside this job.
          GOVERNANCE_TEST_POSTGRES_URL: postgresql://governance_ci:governance_ci@localhost:5432/governance_ci
        run: |
          set +e
          python -m pytest -v --tb=short -m "integration" \
            --junitxml=report-integracion.xml \
            --cov=app --cov-report=term --cov-fail-under=0
          code=$?
          set -e
          # pytest devuelve 5 cuando no hay tests con la marca: no es un fallo.
          if [ "$code" -eq 5 ]; then echo "Sin tests de integración en este servicio."; exit 0; fi
          exit "$code"
      - name: Subir resultados
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: resultados-integracion
          if-no-files-found: ignore
          path: |
            report-integracion.xml
            coverage-integracion.dat

  coverage:
    name: Cobertura (mínimo 90 %)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar coverage
        run: python -m pip install "coverage[toml]"
      - name: Descargar resultados de tests
        uses: actions/download-artifact@v8
        with:
          pattern: resultados-*
          path: resultados
          merge-multiple: true
      - name: Verificar cobertura mínima
        run: |
          python -m coverage combine resultados/coverage-*.dat
          python -m coverage xml -o coverage.xml
          python -m coverage report --fail-under=90
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          if-no-files-found: ignore
          path: coverage.xml

  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Validar docker-compose
        run: |
          [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
          docker network create centinela-net >/dev/null 2>&1 || true
          docker compose config --quiet
      - name: Build imagen
        run: docker build -t governance-service:${{ github.sha }} .
      - name: Verificar imagen
        run: docker image inspect governance-service:${{ github.sha }} --format '{{.Id}} {{.Size}}'

  deploy-staging:
    name: Deploy a servidor staging
    runs-on: [self-hosted, staging]
    needs: [coverage, build]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    steps:
      - name: Actualizar código
        run: |
          cd /opt/centinela/governance-service
          git fetch origin develop
          git reset --hard origin/develop

      - name: Reconstruir contenedor
        run: |
          cd /opt/centinela/governance-service
          docker compose up -d --build --remove-orphans

      - name: Health check
        run: |
          sleep 10
          HEALTHY=false
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8005/health || echo "000")
            echo "Intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              HEALTHY=true; break
            fi
            sleep 6
          done
          if [ "$HEALTHY" = "false" ]; then
            echo "Health check fallido — rollback"
            cd /opt/centinela/governance-service && git reset --hard HEAD~1
            docker compose up -d --build --remove-orphans
            exit 1
          fi
