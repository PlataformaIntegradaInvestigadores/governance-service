services:
  governance-service:
    build: .
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:${GOVERNANCE_PORT:-8005}:${GOVERNANCE_PORT:-8005}"
    environment:
      GOVERNANCE_ENVIRONMENT: ${GOVERNANCE_ENVIRONMENT:-local}
      GOVERNANCE_PUBLIC_BASE_PATH: ${GOVERNANCE_PUBLIC_BASE_PATH:-/api/v1}
      GOVERNANCE_PORT: ${GOVERNANCE_PORT:-8005}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['GOVERNANCE_PORT'] + '/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      centinela-net:
        aliases:
          - governance-service

networks:
  centinela-net:
    external: true

